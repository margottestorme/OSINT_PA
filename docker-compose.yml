services:
  app:
    build: .
    container_name: osint-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15-alpine
    container_name: osint-db
    environment:
      POSTGRES_USER: osint_user
      POSTGRES_PASSWORD: osint_pass
      POSTGRES_DB: osint_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint_user -d osint_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: osint-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Couche d'indexation full-text (Module 11) — OPTIONNELLE : l'app fonctionne
  # sans (dégradation propre). Port lié à la loopback (127.0.0.1) uniquement :
  # accessible en dev-hôte via http://localhost:9200, jamais exposé publiquement.
  # Les autres conteneurs y accèdent via http://elasticsearch:9200 (réseau Docker).
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: osint-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false          # dev uniquement : pas de TLS ni d'auth
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"                 # loopback : dev-hôte OK, jamais public
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  es_data:
