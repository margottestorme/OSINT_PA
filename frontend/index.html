<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Platform — Connexion</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-logo"><i data-lucide="radar"></i></div>
            <h1>OSINT Platform</h1>
            <p class="auth-sub">Intelligence en sources ouvertes</p>
        </div>

        <form id="login-form">
            <div class="field">
                <label for="username">Utilisateur</label>
                <input class="input" type="text" id="username" name="username" required
                       autocomplete="username" placeholder="admin">
            </div>
            <div class="field">
                <label for="password">Mot de passe</label>
                <input class="input" type="password" id="password" name="password" required
                       autocomplete="current-password" placeholder="••••••••">
            </div>

            <div id="login-error" class="alert alert-error hidden" role="alert" aria-live="assertive"></div>

            <button type="submit" class="btn btn-primary" id="login-btn">Se connecter</button>
        </form>
    </div>

    <p class="auth-footer">Projet annuel ESGI — Cybersecurite 4e annee — 2025-2026</p>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
