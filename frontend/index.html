<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Platform — Connexion</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <h1>OSINT Platform</h1>
        <p class="subtitle">Plateforme d'intelligence en sources ouvertes</p>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Utilisateur</label>
                <input type="text" id="username" name="username" required
                       autocomplete="username" placeholder="admin">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required
                       autocomplete="current-password" placeholder="********">
            </div>
            <div id="login-error" class="error-message" hidden></div>
            <button type="submit" id="login-btn">Se connecter</button>
        </form>

        <p class="footer-note">Projet annuel ESGI — Cybersecurite 4e annee — 2025-2026</p>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
